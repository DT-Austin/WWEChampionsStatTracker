[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wwe-champions-faction-tracker"
version = "1.0.0"
description = "Desktop tracker for WWE Champions faction event and feud contribution stats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]

[tool.setuptools]
packages = ["faction_tracker"]
